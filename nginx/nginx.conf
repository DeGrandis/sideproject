events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Visit counts for every site (the stats service turns them into the page at stats.degrand.is). Only page loads are
    # written (a browser opening a page sends Sec-Fetch-Dest: document; scripts, images and API calls don't), plus every
    # server error, and the Proof of Basis demo's assistant questions and Start over. The address is shortened before
    # it's written (1.2.3.4 becomes 1.2.3.0) and the path is written without its query string, so neither a visitor's
    # full IP nor anything they typed reaches the disk. No cookies, nothing added to the pages.
    map $remote_addr $visit_ip {
        "~^(?<net>\d+\.\d+\.\d+)\.\d+$"           $net.0;
        "~^(?<net6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" $net6::;
        default                                         0.0.0.0;
    }
    map "$request_method $http_sec_fetch_dest $uri" $visit_kind {
        "~^GET document "                      page;
        "~^POST \S* /api/ai/chats/[^/]+/send$"  ask;
        "~^POST \S* /api/demo/reset$"           reset;
        default                                "";
    }
    map $status $visit_error {
        "~^5"                                  1;
        default                                0;
    }
    map "$visit_kind$visit_error" $visit_log {
        "0"                                    0;
        default                                1;
    }
    log_format visits escape=default '$visit_ip	$time_iso8601	$server_name	$request_method	$uri	$status	$visit_kind	$http_referer	$http_user_agent';
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/visits/visits.log visits if=$visit_log;
    # The Proof of Basis demo's assistant questions, with their text (the request body, as JSON), for the stats page.
    log_format questions escape=json '{"time":"$time_iso8601","status":"$status","body":"$request_body"}';

    # HTTP to HTTPS redirect for all domains
    server {
        listen 80;
        listen [::]:80;
        server_name degrand.is www.degrand.is api.degrand.is trivia.degrand.is tomatotomato.degrand.is bankof-eng.degrand.is bankof.degrand.is fodmapfinder.degrand.is fodmapsearch.degrand.is fodmap.degrand.is proofofbasis.degrand.is demo.proofofbasis.degrand.is stats.degrand.is id.degrand.is;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend (main site) - HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name degrand.is www.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend (API subdomain) - HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location /auth/ {
            proxy_pass http://auth_backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Trivia app - HTTPS with Socket.IO support
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name trivia.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location / {
            proxy_pass http://trivia:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Socket.IO WebSocket and polling support
        location /api/socket {
            proxy_pass http://trivia:3002/api/socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # Proof of Basis landing page - HTTPS. A static page; its demo buttons go to demo.proofofbasis.degrand.is.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name proofofbasis.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location / {
            proxy_pass http://proof_of_basis_site:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Proof of Basis public demo - HTTPS. X-Forwarded-Proto marks its visitor cookie secure; the assistant's answers
    # stream (the app sends X-Accel-Buffering: no), so allow time for a slow reply. The certificate names
    # demo.proofofbasis.degrand.is itself, since *.degrand.is covers only one level.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name demo.proofofbasis.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        # Assistant questions: also written, with their text, to the questions log the stats page reads. The body is
        # kept in memory (not a temp file) so nginx can log it; a question with its page context is a few KB.
        location ~ ^/api/ai/chats/[^/]+/send$ {
            client_body_buffer_size 256k;
            client_max_body_size 256k;
            access_log /var/log/nginx/access.log;
            access_log /var/log/nginx/visits/visits.log visits if=$visit_log;
            access_log /var/log/nginx/visits/questions.log questions;
            proxy_pass http://proof_of_basis_demo:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://proof_of_basis_demo:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }
    }

    # Pocket ID - HTTPS. Passkey sign-in for Rob's private pages. Its account exists, so /setup is closed for good;
    # sign-ups are off.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name id.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location / {
            proxy_pass http://pocket_id:1411;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }
    }

    # Stats for every site and the box - HTTPS, behind a passkey sign-in. The stats service writes the page; nginx asks
    # oauth2_proxy (auth_request) whether the visitor has signed in with Pocket ID, and sends them to sign in if not.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name stats.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        add_header X-Robots-Tag "noindex" always;

        location /oauth2/ {
            proxy_pass http://oauth2_proxy:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }
        location = /favicon.ico {
            return 204; # the browser asks for it on its own; without this it would start a second sign-in
        }
        location = /oauth2/auth {
            proxy_pass http://oauth2_proxy:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
        }
        location / {
            auth_request /oauth2/auth;
            error_page 401 =302 /oauth2/start?rd=$request_uri;
            root /var/www/stats;
            index index.html;
            add_header Cache-Control "no-store";
            add_header X-Robots-Tag "noindex";
        }
    }

    # Tomatotomato app - HTTPS with Socket.IO support
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tomatotomato.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location / {
            proxy_pass http://tomatotomato:3003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Socket.IO WebSocket and polling support
        location /api/socket {
            proxy_pass http://tomatotomato:3003/api/socket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # Commented out admin frontend for future use
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name admin.degrand.is;
    #
    #     ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;
    #
    #     location / {
    #         # Call backend to validate admin access
    #         auth_request /auth-check;
    #         error_page 401 403 = @redirect_main;
    #
    #         proxy_pass http://admin_frontend:3002/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header Authorization $http_authorization;
    #     }
    #
    #     # Internal endpoint for auth_request
    #     location = /auth-check {
    #         internal;
    #         proxy_pass http://auth_backend:8000/auth/validate-admin;
    #         proxy_set_header Authorization $http_authorization;
    #         proxy_pass_request_body off;
    #         proxy_set_header Content-Length "";
    #     }
    #
    #     # Redirect unauthorized users to main domain
    #     location @redirect_main {
    #         return 302 https://degrand.is;
    #     }
    # }

    # Bank of DeGrandis — eng environment
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name bankof-eng.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location /sales/ {
            proxy_pass http://18.204.32.24:9876;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://18.204.32.24:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Auth0 session cookies are large (~4KB+); increase buffers to avoid 502
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # Bank of DeGrandis — prod environment (shares the eng EC2, different ports)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name bankof.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location /sales/ {
            proxy_pass http://18.204.32.24:9877;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://18.204.32.24:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Auth0 session cookies are large (~4KB+); increase buffers to avoid 502
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # FODMAP aliases - 301 redirect to canonical domain
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name fodmapsearch.degrand.is fodmap.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        return 301 https://fodmapfinder.degrand.is$request_uri;
    }

    # FODMAP Search - static file served directly by nginx
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name fodmapfinder.degrand.is;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        root /var/www/fodmap;
        index index.html;

        location / {
            try_files $uri /index.html;
        }
    }

    # Catch-all for other subdomains - redirect to main site
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ~^(?<subdomain>.+)\.degrand\.is$;

        ssl_certificate /etc/letsencrypt/live/degrand.is/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/degrand.is/privkey.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://degrand.is$request_uri;
        }
    }
}