# .github/workflows/deploy.yml
#
# Builds every service image, pushes it tagged with this commit's SHA (and :latest), and deploys exactly those tags to
# EC2. The .env on the server carries IMAGE_TAG=<sha>, so docker-compose.yaml always names this commit's images: what
# runs is never ambiguous, and the last step fails the run unless every container is running this commit's images.
#
# Speed: builds use the GitHub Actions layer cache (docker-compose.ci.yaml), so only services whose files changed
# actually rebuild; on the server only containers whose image changed are recreated (no full down, no pruning of
# images that are still in use).
name: Build and Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time, in push order (a newer push waits instead of racing the running one).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images (cached, tagged with the commit SHA and latest)
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yaml
            docker-compose.ci.yaml
          push: true

      - name: Create .env file
        run: |
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
          printf "JWT_SECRET=%s\n" "${{ secrets.JWT_SECRET }}" >> .env
          printf "JWT_PUBLIC_KEY=%s\n" "${{ secrets.JWT_PUBLIC_KEY }}" >> .env
          echo "RUNNING_ENV=production" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          # Add other env vars as needed

      - name: Build FODMAP static site
        run: cd fodmap_frontend && python build.py

      - name: Copy docker-compose and .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: |
            docker-compose.yaml,
            .env,
            postgres/*,
            fodmap_frontend/*,
          target: /home/${{ secrets.EC2_USER }}/docker

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/docker
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi

            # Pull this commit's images, then recreate only the containers whose image or config changed.
            $DC pull
            $DC up -d --remove-orphans
            # Remove images no container uses any more (older commits); images in use are kept.
            docker image prune -af --filter "until=24h"

            # Verify: every container running, and every image we build on this commit's tag. The pause lets a container
            # that crashes on start show up as restarting/exited instead of passing.
            sleep 15
            echo "Deployed commit ${{ github.sha }}:"
            failed=0
            for id in $($DC ps -q); do
              info=$(docker inspect --format '{{.Name}} {{.Config.Image}} {{.State.Status}}' "$id")
              echo "  $info"
              set -- $info
              if [ "$3" != "running" ]; then failed=1; fi
              case "$2" in
                degrandis/*) if [ "${2##*:}" != "${{ github.sha }}" ]; then failed=1; fi ;;
              esac
            done
            if [ "$failed" -ne 0 ]; then
              echo "Deploy check failed: a container is not running, or is not on this commit's image."
              exit 1
            fi
