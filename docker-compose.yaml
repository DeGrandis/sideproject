services:
  # frontend:
  #   build:
  #     context: ./frontend
  #   image: degrandis/frontend:latest
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - app-network

  # backend:
  #   build:
  #     context: ./backend
  #   image: degrandis/backend:latest
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - CORS_ORIGIN=https://sideproject.biblestudycraft.com
  #   networks:
  #     - app-network

  frontend:
    build:
      context: ./auth_frontend
    image: degrandis/auth_frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=https://api.degrand.is
    networks:
      - client-side
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3


  trivia:
    build:
      context: ./trivia
    image: degrandis/trivia:${IMAGE_TAG:-latest}
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION:-us-east-1}
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/trivia"
        awslogs-stream: "trivia"
        awslogs-create-group: "true"
    networks:
      - client-side

  tomatotomato:
    build:
      context: ./tomatotomato
    image: degrandis/tomatotomato:${IMAGE_TAG:-latest}
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - NEXT_PUBLIC_APP_VERSION=1.1.2
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/tomatotomato"
        awslogs-stream: "tomatotomato"
        awslogs-create-group: "true"
    networks:
      - client-side

  # Proof of Basis landing page (proofofbasis.degrand.is): a static page, built like the demo by
  # github.com/DeGrandis/proof-of-basis's workflow; set POB_SITE_TAG to a commit SHA to pin one.
  proof_of_basis_site:
    image: ghcr.io/degrandis/proof-of-basis-site:${POB_SITE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/proof-of-basis-site"
        awslogs-stream: "proof-of-basis-site"
        awslogs-create-group: "true"
    networks:
      - client-side

  # Pocket ID (id.degrand.is): a passkey-only sign-in for Rob's private pages, starting with stats.degrand.is. One
  # account, sign-ups off. Its encryption key lives only on the server (auth/pocket-id.key, see auth/README.md; a
  # mounted file rather than env_file, so the CI build, which reads this file, doesn't need it); its data (a SQLite
  # file) is in the pocket_id_data volume.
  pocket_id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.1
    restart: unless-stopped
    environment:
      - APP_URL=https://id.degrand.is
      - ENCRYPTION_KEY_FILE=/run/secrets/pocket-id.key
      - TRUST_PROXY=true # only nginx can reach it
      - ANALYTICS_DISABLED=true # no daily "instance is running" ping
      - ALLOW_INSECURE_CALLBACK_URLS=false
      - ALLOW_USER_SIGNUPS=disabled
    volumes:
      - pocket_id_data:/app/data
      - ./auth/pocket-id.key:/run/secrets/pocket-id.key:ro
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/pocket-id"
        awslogs-stream: "pocket-id"
        awslogs-create-group: "true"
    networks:
      - client-side

  # The gatekeeper for stats.degrand.is: nginx asks it (auth_request) whether the visitor has signed in with Pocket ID,
  # and sends them to sign in if not. Its secrets (cookie secret, client ID and secret) are in auth/oauth2-proxy.cfg,
  # only on the server. Pocket ID's addresses are given outright, so it starts without reaching Pocket ID; it reaches
  # id.degrand.is through nginx's network alias below.
  oauth2_proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    user: "1000:1000" # ec2-user, the owner of the config file
    command: ["--config=/run/secrets/oauth2-proxy.cfg"]
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Pocket ID
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://id.degrand.is
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_LOGIN_URL=https://id.degrand.is/authorize
      - OAUTH2_PROXY_REDEEM_URL=https://id.degrand.is/api/oidc/token
      - OAUTH2_PROXY_PROFILE_URL=https://id.degrand.is/api/oidc/userinfo
      - OAUTH2_PROXY_OIDC_JWKS_URL=https://id.degrand.is/.well-known/jwks.json
      - OAUTH2_PROXY_REDIRECT_URL=https://stats.degrand.is/oauth2/callback
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_SCOPE=openid email profile
      - OAUTH2_PROXY_EMAIL_DOMAINS=*  # whoever can sign in to Pocket ID: only Rob, sign-ups are off
      # Pocket ID marks emails unverified unless it can send email (it can't here). The email decides nothing:
      # Pocket ID's own group rule on the "stats" client decides who gets a token.
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_TRUSTED_PROXY_IPS=172.16.0.0/12 # Docker's networks: only nginx reaches it
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_COOKIE_NAME=__Host-stats
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_EXPIRE=168h
    volumes:
      - ./auth/oauth2-proxy.cfg:/run/secrets/oauth2-proxy.cfg:ro
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/oauth2-proxy"
        awslogs-stream: "oauth2-proxy"
        awslogs-create-group: "true"
    networks:
      - client-side

  # Proof of Basis visit reports (stats.degrand.is, behind a passkey sign-in): GoAccess turns nginx's visit logs for the
  # landing page and the demo into two reports every hour. The script comes from stats/ (copied by the deploy); the
  # image is GoAccess's own, pinned. See stats/README.md.
  pob_stats:
    image: allinurl/goaccess:1.11
    entrypoint: ["/bin/sh", "/stats/run.sh"]
    restart: unless-stopped
    volumes:
      - ./stats:/stats:ro
      - pob_logs:/logs
      - pob_stats_data:/data
      - pob_stats_report:/report
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/pob-stats"
        awslogs-stream: "pob-stats"
        awslogs-create-group: "true"
    networks:
      - client-side

  # Proof of Basis public demo (demo.proofofbasis.degrand.is): invented data, a private copy per visitor, no login. The
  # image is built by github.com/DeGrandis/proof-of-basis's own workflow, so it has no build section and isn't tied to
  # IMAGE_TAG; set POB_DEMO_TAG to a commit SHA to pin one. Its assistant uses Llama 3.3 70B in Amazon Bedrock through
  # the instance role (bedrock:InvokeModel, like trivia); without that it runs with the assistant off.
  proof_of_basis_demo:
    image: ghcr.io/degrandis/proof-of-basis-demo:${POB_DEMO_TAG:-latest}
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
    restart: unless-stopped
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/proof-of-basis-demo"
        awslogs-stream: "proof-of-basis-demo"
        awslogs-create-group: "true"
    networks:
      - client-side

  auth_backend:
    build:
      context: ./auth_backend
    image: degrandis/auth_backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGIN=https://degrand.is,https://www.degrand.is
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - COOKIE_DOMAIN=.degrand.is
      - RUNNING_ENV=production
    networks:
      - client-side
      - server-side
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs  # Bind mount ./logs on the host to /app/logs in the container
    logging:
      driver: json-file # Still use a logging driver if you want to view logs with docker compose logs
      options:
        max-size: 10m
        max-file: 3


  db:
    image: postgres:12-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - server-side
    ports:
      - 5432:5432
    volumes:
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d/ 
      - ${PGDATA_VOLUME:-postgres_data}:/var/lib/postgresql/data 

  nginx:
    build:
      context: ./nginx
    image: degrandis/nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - trivia
      - tomatotomato
      - auth_backend
      - proof_of_basis_demo
      - proof_of_basis_site
      - pocket_id
      - oauth2_proxy
    networks:
      client-side:
        aliases:
          - id.degrand.is # so oauth2_proxy reaches Pocket ID through nginx, not out and back through the internet
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d # Mount your Nginx configuration
      - ./certbot/www:/var/www/certbot:ro # Shared directory for ACME challenge (read-only)
      - ./certbot/conf:/etc/letsencrypt:ro # Shared directory for certificates (read-only)
      - ./fodmap_frontend:/var/www/fodmap:ro # FODMAP static site (run build.py first)
      - pob_logs:/var/log/nginx/pob # Proof of Basis visit logs, read by pob_stats
      - pob_stats_report:/var/www/stats:ro # the reports pob_stats writes, served at stats.degrand.is
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "us-east-1"
        awslogs-group: "/containers/nginx"
        awslogs-stream: "nginx"
        awslogs-create-group: "true"
    restart: unless-stopped

  certbot:
    image: certbot/dns-route53:latest
    volumes:
      - ./certbot/www:/var/www/certbot:rw # Read-write for ACME challenge
      - ./certbot/conf:/etc/letsencrypt:rw # Read-write for certificates
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --dns-route53 --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - client-side
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  # Academy Launcher relay (relay.degrand.is): forwards Clone Wars online games between players. Plain UDP, not behind
  # nginx; the EC2 security group must allow inbound UDP 3074. Source: github.com/DeGrandis/academy-launcher.
  academy_relay:
    build:
      context: https://github.com/DeGrandis/academy-launcher.git#main:server/relay
    image: degrandis/academy-relay:${IMAGE_TAG:-latest}
    ports:
      - "3074:3074/udp"
    environment:
      - RELAY_PORT=3074
      - RELAY_EXPIRE=30
      - RELAY_MAX_ROOMS=1000
      - RELAY_MAX_MEMBERS=8
      - RELAY_LOG=info
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  client-side:
    driver: bridge
  server-side: {}

volumes:
  postgres_data:
  pob_logs:
  pob_stats_data:
  pob_stats_report:
  pocket_id_data: