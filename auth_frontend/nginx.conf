# Serves the built site on port 3000, as `serve -s dist` did: any path that
# isn't a file gets index.html, so the app's own routes work on reload.
server {
    listen 3000;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content hashes in their names, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
